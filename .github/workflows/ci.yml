name: Local server checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --check serve.js
      - run: node --check test-apis.js
      - run: node --test tests/*.test.mjs
