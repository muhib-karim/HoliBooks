<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="HoliBooks: sacred texts of six traditions in one reader">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d1a"/>
      <stop offset="0.55" stop-color="#16132b"/>
      <stop offset="1" stop-color="#231a12"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#c9a55c" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#c9a55c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f3dca0"/>
      <stop offset="1" stop-color="#c9a55c"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#glow)"/>

  <!-- Open book with six page lines, one per tradition -->
  <g transform="translate(1000 168)" fill="none" stroke="url(#gold)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 -62 C -40 -80 -100 -80 -140 -62 L -140 70 C -100 52 -40 52 0 70 Z" fill="#c9a55c" fill-opacity="0.07"/>
    <path d="M0 -62 C 40 -80 100 -80 140 -62 L 140 70 C 100 52 40 52 0 70 Z" fill="#c9a55c" fill-opacity="0.07"/>
    <line x1="0" y1="-62" x2="0" y2="70"/>
    <g stroke-width="2" stroke-opacity="0.7">
      <path d="M-120 -36 C -90 -46 -50 -46 -20 -36"/>
      <path d="M-120 -6 C -90 -16 -50 -16 -20 -6"/>
      <path d="M-120 24 C -90 14 -50 14 -20 24"/>
      <path d="M20 -36 C 50 -46 90 -46 120 -36"/>
      <path d="M20 -6 C 50 -16 90 -16 120 -6"/>
      <path d="M20 24 C 50 14 90 14 120 24"/>
    </g>
  </g>
  <!-- Six points of light arching over the book -->
  <g fill="#f3dca0">
    <circle cx="850" cy="78" r="5" fill-opacity="0.9"/>
    <circle cx="905" cy="52" r="5" fill-opacity="0.9"/>
    <circle cx="970" cy="40" r="5" fill-opacity="0.9"/>
    <circle cx="1030" cy="40" r="5" fill-opacity="0.9"/>
    <circle cx="1095" cy="52" r="5" fill-opacity="0.9"/>
    <circle cx="1150" cy="78" r="5" fill-opacity="0.9"/>
  </g>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="88" y="150" font-size="84" font-weight="700" fill="#f7f3ea" letter-spacing="1">Holi<tspan fill="url(#gold)">Books</tspan></text>
    <text x="92" y="200" font-size="28" fill="#d9d4c7">Six sacred texts. One distraction-free reader.</text>
    <text x="92" y="250" font-size="16" fill="#a59f90" letter-spacing="1.5">QURAN · BIBLE · GITA · TORAH · GURU GRANTH SAHIB · DHAMMAPADA</text>
  </g>
</svg>
