    <circle cx="272" cy="142" r="8"/>
    <circle cx="304" cy="152" r="8"/>
    <circle cx="336" cy="170" r="8"/>
  </g>
  <path d="M256 214 C222 192 180 188 150 198 L150 346 C180 336 222 340 256 362 Z" fill="#c9a55c"/>
